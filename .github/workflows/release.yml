name: Build & Release NSync APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: 'NSync Update'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Extract versionName from build.gradle.kts or use commit count
            VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            REV_COUNT=$(git rev-list --count HEAD)
            TAG="v${VERSION_NAME}.${REV_COUNT}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          CLEAN_VER="${{ steps.version_info.outputs.tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          REV_COUNT=$(git rev-list --count HEAD)
          ./gradlew assembleRelease -PversionName="${CLEAN_VER}" -PversionCode="${REV_COUNT}" --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/NSync-${{ steps.version_info.outputs.tag }}.apk
          cp app/build/outputs/apk/release/app-release.apk release_assets/NSync-latest.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.version_info.outputs.tag }}
          body: |
            ## NSync Student Companion App Update
            - Automatically built from commit ${{ github.sha }}
            - Download and install `NSync-latest.apk` or update directly inside the app.
          draft: false
          prerelease: false
          files: |
            release_assets/NSync-${{ steps.version_info.outputs.tag }}.apk
            release_assets/NSync-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSync-release-apk
          path: release_assets/NSync-latest.apk
