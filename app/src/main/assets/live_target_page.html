<script>
	function setTimeout_dbg(){
		var d = new Date();
		var n = d.getTime();
		dbgstart = n;
		dbg = 'ON';
		debugger;
		dbg = 'OFF';
		var d = new Date();
		var n = d.getTime();
		dbgend = n;
		if(dbg=='ON') alert(dbgend-dbgstart);
		if((dbgend-dbgstart)>1000) window.location.href='student_login.php?lo=1';
	}
	setInterval(setTimeout_dbg, 3000);
	</script>
